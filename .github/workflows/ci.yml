name: CI - Data Platform Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-beam-pipeline:
    name: Run Apache Beam Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/streaming_beam_dataflow/requirements.txt
          pip install pytest

      - name: Run Beam Unit Tests (TestPipeline & DLQ Assertion)
        run: |
          pytest pipelines/streaming_beam_dataflow/tests/ -v

  validate-terraform:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check terraform/
